<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PVGS ERP - Faculty Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body class="bg-gray-100">
    <div x-data="facultyPortal()" class="min-h-screen">
        <!-- Navigation -->
        <nav class="bg-purple-600 text-white p-4">
            <div class="flex justify-between items-center">
                <h1 class="text-xl font-bold">PVGS Faculty Portal</h1>
                <div class="flex items-center space-x-4">
                    <span x-text="faculty.name"></span>
                    <button @click="logout()" class="bg-red-500 px-3 py-1 rounded">Logout</button>
                </div>
            </div>
        </nav>

        <div class="container mx-auto px-4 py-6">
            <!-- Tabs -->
            <div class="bg-white rounded-lg shadow mb-6">
                <div class="border-b border-gray-200">
                    <nav class="flex space-x-8 px-6">
                        <button @click="activeTab = 'attendance'" 
                                :class="activeTab === 'attendance' ? 'border-purple-500 text-purple-600' : 'border-transparent text-gray-500'"
                                class="py-4 px-1 border-b-2 font-medium text-sm">
                            Mark Attendance
                        </button>
                        <button @click="activeTab = 'results'" 
                                :class="activeTab === 'results' ? 'border-purple-500 text-purple-600' : 'border-transparent text-gray-500'"
                                class="py-4 px-1 border-b-2 font-medium text-sm">
                            Enter Results
                        </button>
                        <button @click="activeTab = 'reports'" 
                                :class="activeTab === 'reports' ? 'border-purple-500 text-purple-600' : 'border-transparent text-gray-500'"
                                class="py-4 px-1 border-b-2 font-medium text-sm">
                            Reports
                        </button>
                    </nav>
                </div>

                <div class="p-6">
                    <!-- Attendance Tab -->
                    <div x-show="activeTab === 'attendance'">
                        <h3 class="text-lg font-semibold mb-4">Mark Attendance</h3>
                        
                        <!-- Attendance Form -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Subject</label>
                                <select x-model="attendanceForm.subject_id" @change="loadStudentsForAttendance()" 
                                        class="mt-1 block w-full border-gray-300 rounded-md">
                                    <option value="">Select Subject</option>
                                    <template x-for="subject in subjects" :key="subject.id">
                                        <option :value="subject.id" x-text="subject.name"></option>
                                    </template>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Date</label>
                                <input type="date" x-model="attendanceForm.attendance_date" 
                                       class="mt-1 block w-full border-gray-300 rounded-md">
                            </div>
                            <div class="flex items-end">
                                <button @click="markAllPresent()" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700">
                                    Mark All Present
                                </button>
                            </div>
                        </div>

                        <!-- Student List -->
                        <div x-show="studentsForAttendance.length > 0" class="bg-white border rounded-lg">
                            <div class="px-4 py-3 border-b bg-gray-50">
                                <h4 class="font-medium">Students</h4>
                            </div>
                            <div class="divide-y divide-gray-200">
                                <template x-for="(student, index) in studentsForAttendance" :key="student.id">
                                    <div class="px-4 py-3 flex items-center justify-between">
                                        <div>
                                            <p class="font-medium" x-text="student.name"></p>
                                            <p class="text-sm text-gray-500" x-text="student.admission_number"></p>
                                        </div>
                                        <div class="flex space-x-2">
                                            <label class="flex items-center">
                                                <input type="radio" :name="`attendance_${student.id}`" value="present" 
                                                       x-model="student.status" class="mr-1">
                                                <span class="text-green-600">Present</span>
                                            </label>
                                            <label class="flex items-center">
                                                <input type="radio" :name="`attendance_${student.id}`" value="absent" 
                                                       x-model="student.status" class="mr-1">
                                                <span class="text-red-600">Absent</span>
                                            </label>
                                            <label class="flex items-center">
                                                <input type="radio" :name="`attendance_${student.id}`" value="late" 
                                                       x-model="student.status" class="mr-1">
                                                <span class="text-yellow-600">Late</span>
                                            </label>
                                        </div>
                                    </div>
                                </template>
                            </div>
                            <div class="px-4 py-3 border-t bg-gray-50">
                                <button @click="submitAttendance()" class="bg-purple-600 text-white px-6 py-2 rounded-md hover:bg-purple-700">
                                    Submit Attendance
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Results Tab -->
                    <div x-show="activeTab === 'results'">
                        <h3 class="text-lg font-semibold mb-4">Enter Results</h3>
                        
                        <!-- Results Form -->
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Subject</label>
                                <select x-model="resultsForm.subject_id" @change="loadStudentsForResults()" 
                                        class="mt-1 block w-full border-gray-300 rounded-md">
                                    <option value="">Select Subject</option>
                                    <template x-for="subject in subjects" :key="subject.id">
                                        <option :value="subject.id" x-text="subject.name"></option>
                                    </template>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Exam Type</label>
                                <select x-model="resultsForm.exam_type" class="mt-1 block w-full border-gray-300 rounded-md">
                                    <option value="internal">Internal</option>
                                    <option value="external">External</option>
                                    <option value="practical">Practical</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Max Marks</label>
                                <input type="number" x-model="resultsForm.max_marks" 
                                       class="mt-1 block w-full border-gray-300 rounded-md">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Academic Year</label>
                                <input type="text" x-model="resultsForm.academic_year" placeholder="2024-25"
                                       class="mt-1 block w-full border-gray-300 rounded-md">
                            </div>
                        </div>

                        <!-- Student Results -->
                        <div x-show="studentsForResults.length > 0" class="bg-white border rounded-lg">
                            <div class="px-4 py-3 border-b bg-gray-50">
                                <h4 class="font-medium">Enter Marks</h4>
                            </div>
                            <div class="divide-y divide-gray-200">
                                <template x-for="student in studentsForResults" :key="student.id">
                                    <div class="px-4 py-3 flex items-center justify-between">
                                        <div>
                                            <p class="font-medium" x-text="student.name"></p>
                                            <p class="text-sm text-gray-500" x-text="student.admission_number"></p>
                                        </div>
                                        <div class="flex items-center space-x-2">
                                            <input type="number" x-model="student.marks_obtained" 
                                                   :max="resultsForm.max_marks" min="0"
                                                   class="w-20 border-gray-300 rounded-md text-center"
                                                   placeholder="Marks">
                                            <span class="text-gray-500">/ <span x-text="resultsForm.max_marks"></span></span>
                                        </div>
                                    </div>
                                </template>
                            </div>
                            <div class="px-4 py-3 border-t bg-gray-50">
                                <button @click="submitResults()" class="bg-purple-600 text-white px-6 py-2 rounded-md hover:bg-purple-700">
                                    Submit Results
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Reports Tab -->
                    <div x-show="activeTab === 'reports'">
                        <h3 class="text-lg font-semibold mb-4">Class Reports</h3>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <!-- Attendance Report -->
                            <div class="bg-white p-6 rounded-lg border">
                                <h4 class="font-medium mb-4">Attendance Summary</h4>
                                <template x-for="report in attendanceReports" :key="report.subject_id">
                                    <div class="mb-3 p-3 bg-gray-50 rounded">
                                        <p class="font-medium" x-text="report.subject_name"></p>
                                        <p class="text-sm text-gray-600">Average: <span x-text="report.average_percentage"></span>%</p>
                                        <div class="mt-1 bg-gray-200 rounded-full h-2">
                                            <div class="bg-green-600 h-2 rounded-full" :style="`width: ${report.average_percentage}%`"></div>
                                        </div>
                                    </div>
                                </template>
                            </div>

                            <!-- Results Summary -->
                            <div class="bg-white p-6 rounded-lg border">
                                <h4 class="font-medium mb-4">Results Summary</h4>
                                <template x-for="report in resultsReports" :key="report.subject_id">
                                    <div class="mb-3 p-3 bg-gray-50 rounded">
                                        <p class="font-medium" x-text="report.subject_name"></p>
                                        <p class="text-sm text-gray-600">
                                            Pass Rate: <span x-text="report.pass_percentage"></span>%
                                        </p>
                                        <p class="text-sm text-gray-600">
                                            Class Average: <span x-text="report.class_average"></span>%
                                        </p>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function facultyPortal() {
            return {
                activeTab: 'attendance',
                faculty: { name: 'Faculty User' },
                subjects: [],
                studentsForAttendance: [],
                studentsForResults: [],
                attendanceReports: [],
                resultsReports: [],
                attendanceForm: {
                    subject_id: '',
                    attendance_date: new Date().toISOString().split('T')[0]
                },
                resultsForm: {
                    subject_id: '',
                    exam_type: 'internal',
                    max_marks: 100,
                    academic_year: '2024-25',
                    semester: 1
                },

                async init() {
                    await this.loadSubjects();
                    await this.loadReports();
                },

                async loadSubjects() {
                    try {
                        // Mock subjects data
                        this.subjects = [
                            { id: 1, name: 'Programming in C' },
                            { id: 2, name: 'Mathematics I' },
                            { id: 3, name: 'Data Structures' }
                        ];
                    } catch (error) {
                        console.error('Error loading subjects:', error);
                        this.subjects = [];
                    }
                },

                async loadStudentsForAttendance() {
                    if (!this.attendanceForm.subject_id) return;
                    
                    try {
                        // Mock students data
                        this.studentsForAttendance = [
                            {
                                id: 1,
                                name: 'John Doe',
                                admission_number: 'ADM2024001',
                                status: 'present'
                            },
                            {
                                id: 2,
                                name: 'Jane Smith',
                                admission_number: 'ADM2024002',
                                status: 'present'
                            },
                            {
                                id: 3,
                                name: 'Mike Johnson',
                                admission_number: 'ADM2024003',
                                status: 'present'
                            }
                        ];
                    } catch (error) {
                        console.error('Error loading students:', error);
                        this.studentsForAttendance = [];
                    }
                },

                async loadStudentsForResults() {
                    if (!this.resultsForm.subject_id) return;
                    
                    try {
                        // Mock students data for results
                        this.studentsForResults = [
                            {
                                id: 1,
                                name: 'John Doe',
                                admission_number: 'ADM2024001',
                                marks_obtained: 0
                            },
                            {
                                id: 2,
                                name: 'Jane Smith',
                                admission_number: 'ADM2024002',
                                marks_obtained: 0
                            },
                            {
                                id: 3,
                                name: 'Mike Johnson',
                                admission_number: 'ADM2024003',
                                marks_obtained: 0
                            }
                        ];
                    } catch (error) {
                        console.error('Error loading students:', error);
                        this.studentsForResults = [];
                    }
                },

                markAllPresent() {
                    this.studentsForAttendance.forEach(student => {
                        student.status = 'present';
                    });
                },

                async submitAttendance() {
                    try {
                        // Mock attendance submission
                        if (this.studentsForAttendance.length === 0) {
                            alert('No students to mark attendance for');
                            return;
                        }

                        // Simulate API call
                        setTimeout(() => {
                            alert('Attendance marked successfully! (Demo mode)');
                            this.studentsForAttendance = [];
                            this.attendanceForm.subject_id = '';
                        }, 500);
                    } catch (error) {
                        console.error('Error submitting attendance:', error);
                        alert('Error submitting attendance');
                    }
                },

                async submitResults() {
                    try {
                        // Mock results submission
                        if (this.studentsForResults.length === 0) {
                            alert('No students to enter results for');
                            return;
                        }

                        // Check if marks are entered
                        const hasMarks = this.studentsForResults.some(s => s.marks_obtained > 0);
                        if (!hasMarks) {
                            alert('Please enter marks for at least one student');
                            return;
                        }

                        // Simulate API call
                        setTimeout(() => {
                            alert('Results entered successfully! (Demo mode)');
                            this.studentsForResults = [];
                            this.resultsForm.subject_id = '';
                        }, 500);
                    } catch (error) {
                        console.error('Error submitting results:', error);
                        alert('Error submitting results');
                    }
                },

                async loadReports() {
                    // Load sample reports data
                    this.attendanceReports = [
                        { subject_id: 1, subject_name: 'Programming in C', average_percentage: 85 },
                        { subject_id: 2, subject_name: 'Mathematics I', average_percentage: 78 }
                    ];
                    
                    this.resultsReports = [
                        { subject_id: 1, subject_name: 'Programming in C', pass_percentage: 92, class_average: 76 },
                        { subject_id: 2, subject_name: 'Mathematics I', pass_percentage: 88, class_average: 72 }
                    ];
                },

                logout() {
                    localStorage.removeItem('token');
                    window.location.href = '/login.html';
                }
            }
        }
    </script>
</body>
</html>
